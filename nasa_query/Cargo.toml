[package]
name = "nasa"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "60.1.0"
parquet = { version = "60.1.0", features = ["arrow"]}
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"]}
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
anyhow = "1.0.104"
tower-http = { version = "0.7.1", features = ["catch-panic", "cors"] }
arrow-array = "60.1.0"
